[project]
name = "kmeanslab"
version = "1.0.0"
description = "Offline clustering and visualization laboratory"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.2,<3", "pywebview>=6.1,<7"]

[dependency-groups]
linux = ["pywebview[qt]>=6.1,<7; sys_platform == 'linux'"]
dev = ["pytest>=8.3,<10", "pyinstaller>=6.15,<7"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
